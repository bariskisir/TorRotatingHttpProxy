name: Container checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, race detector and static checks
        run: docker build --target test -t torproxy-tests .
      - name: Build production image
        run: docker build -t tor-rotating-http-proxy .
